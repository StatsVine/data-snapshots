name: _fetch

# Reusable core. Holds no configuration of its own — every source lives in its
# own caller workflow, which owns its schedule and its parameters.
on:
  workflow_call:
    inputs:
      name:
        description: "Source name; becomes data/<name>.json and csv/<name>.csv"
        required: true
        type: string
      url:
        description: "URL to fetch"
        required: true
        type: string
      csv:
        description: "Also emit a flattened CSV"
        required: false
        type: boolean
        default: true
      root:
        description: >-
          Dotted path to a subtree to hoist to the top of the file, for a
          source that wraps its table in an envelope. Applied before drop and
          sort, so a nested table becomes sortable.
        required: false
        type: string
        default: ""
      keep:
        description: >-
          Comma-separated allowlist of record fields. Everything else is
          dropped, so a field the source adds later defaults to excluded
          rather than being published automatically. Mutually exclusive
          with drop.
        required: false
        type: string
        default: ""
      drop:
        description: "Comma-separated volatile fields to strip before committing"
        required: false
        type: string
        default: ""
      sort:
        description: >-
          Comma-separated fields to sort a top-level JSON array by. Use it for
          any source that returns a table in an order of its own choosing.
        required: false
        type: string
        default: ""
      columns:
        description: "Comma-separated CSV columns to keep, in order (default: all)"
        required: false
        type: string
        default: ""
      where:
        description: "Comma-separated CSV row filters, ANDed: 'active=true,team'"
        required: false
        type: string
        default: ""
      views:
        description: >-
          JSON array of named CSV views, each with optional columns/where.
          Takes precedence over the single columns/where pair above.
          Output lands at csv/<name>-<view>.csv.
        required: false
        type: string
        default: ""
      header:
        description: >-
          Name of an auth header to send, e.g. x-api-key. Only the name goes
          here -- the value comes from the api_key secret below. Sources that
          need no auth leave this empty.
        required: false
        type: string
        default: ""
    secrets:
      api_key:
        description: >-
          Value for the `header` request header. Declared optional so the
          unauthenticated sources can keep calling this workflow without it;
          download.sh fails loudly if `header` is set and this is not.
        required: false

# All sources serialize here so two schedules can never race the same push.
concurrency:
  group: fetch-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Actions are pinned by commit SHA rather than by tag. A tag is mutable:
      # whoever controls the action can move v7 to new code, which would then
      # run in this job -- the one job in the repo holding both contents:write
      # and an API key. The trailing comment is the human-readable version and
      # is what Dependabot reads when it proposes a bump.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Fetch
        # Inputs go through env rather than being interpolated straight into
        # the script: a `${{ }}` inside run: is a shell-injection seam.
        env:
          SOURCE_NAME: ${{ inputs.name }}
          SOURCE_URL: ${{ inputs.url }}
          WANT_CSV: ${{ inputs.csv }}
          ROOT: ${{ inputs.root }}
          KEEP: ${{ inputs.keep }}
          DROP: ${{ inputs.drop }}
          SORT: ${{ inputs.sort }}
          COLUMNS: ${{ inputs.columns }}
          WHERE: ${{ inputs.where }}
          VIEWS: ${{ inputs.views }}
          HEADER: ${{ inputs.header }}
          # Masked by Actions wherever it would otherwise appear in a log.
          SOURCE_API_KEY: ${{ secrets.api_key }}
        run: |
          args=("$SOURCE_NAME" "$SOURCE_URL" --root "$ROOT" --keep "$KEEP")
          args+=(--drop "$DROP" --sort "$SORT")
          [ "$WANT_CSV" = "true" ] || args+=(--no-csv)
          [ -z "$HEADER" ] || args+=(--header "$HEADER")
          if [ -n "$VIEWS" ]; then
            args+=(--views "$VIEWS")
          else
            args+=(--columns "$COLUMNS" --where "$WHERE")
          fi
          scripts/fetch.sh "${args[@]}"

      - name: Commit
        env:
          SOURCE_NAME: ${{ inputs.name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data csv
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "$SOURCE_NAME: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          # Concurrency should prevent races, but GitHub only queues one
          # pending run per group — rebase rather than fail if one slips past.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
