name: sleeper/players-nfl

on:
  # ~19MB pretty. Sleeper only refreshes this daily, so polling harder just
  # burns minutes and grows the repo for nothing.
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

jobs:
  fetch:
    uses: ./.github/workflows/_fetch.yml
    permissions:
      contents: write
    with:
      name: sleeper/players-nfl
      url: https://api.sleeper.app/v1/players/nfl
      csv: true
      # Both move on their own, for players whose real fields never change.
      # The first daily diff was 1,346 changed lines, 1,272 of them these two:
      # search_rank is a global popularity rank, so one player's news nudges
      # everyone below them, and news_updated is a millisecond timestamp that
      # already moved between two pulls minutes apart. Neither is worth a line
      # of history; `status`/`injury_status` still carry the news that matters.
      drop: news_updated,search_rank
      # One download, two views that answer different questions and do not
      # overlap. Both are derived from the same parse.
      #
      # ids: every player ever, narrow. This is the crosswalk table -- you
      #   look up retired players by espn_id, so it deliberately keeps all
      #   rows. The columns are curated rather than every field ending in
      #   _id: player_id duplicates _key exactly, opta_id and pandascore_id
      #   are 100% empty, and the metadata.* ones are Sleeper internals.
      # rostered: the current squad in full detail. A non-empty team is what
      #   actually means "on a roster" -- `active` alone passes 77% of the
      #   file and barely filters at all.
      views: |
        [
          {"name": "ids",
           "columns": "_key,active,full_name,team,position,status,espn_id,fantasy_data_id,gsis_id,kalshi_id,oddsjam_id,rotowire_id,rotoworld_id,sportradar_id,stats_id,swish_id,yahoo_id"},
          {"name": "rostered",
           "where": "team"}
        ]
