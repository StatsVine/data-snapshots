name: sleeper/players-nfl

on:
  # ~19MB pretty. Sleeper only refreshes this daily, so polling harder just
  # burns minutes and grows the repo for nothing.
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

jobs:
  fetch:
    uses: ./.github/workflows/_fetch.yml
    permissions:
      contents: write
    with:
      name: sleeper/players-nfl
      url: https://api.sleeper.app/v1/players/nfl
      csv: true
      # The JSON stays complete; the CSV is a deliberately narrow view of it.
      # Unfiltered this is 12k rows x 103 cols = 4.3MB, which GitHub renders
      # badly and which buries the handful of fields anyone actually reads.
      columns: >-
        _key,full_name,team,position,status,injury_status,age,years_exp,
        number,college,espn_id,gsis_id,sportradar_id
      # `active` alone barely filters (Sleeper flags 9.4k of 12.2k players
      # active); a non-empty `team` is what actually means "on a roster".
      where: active=true,team
