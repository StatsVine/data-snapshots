name: sleeper/players-nfl

on:
  # ~19MB pretty. Sleeper only refreshes this daily, so polling harder just
  # burns minutes and grows the repo for nothing.
  schedule:
    - cron: "15 7 * * *"
  workflow_dispatch:

jobs:
  fetch:
    uses: ./.github/workflows/_fetch.yml
    permissions:
      contents: write
    with:
      name: sleeper/players-nfl
      url: https://api.sleeper.app/v1/players/nfl
      csv: true
      # One download, many views. The JSON stays complete either way; these
      # only shape the tabular projections of it.
      views: |
        [
          {"name": "all"},
          {"name": "rostered",
           "columns": "_key,full_name,team,position,status,injury_status,age,years_exp,number,college,espn_id,gsis_id,sportradar_id",
           "where": "active=true,team"}
        ]
