name: sleeper/state-nfl

on:
  # Tiny payload, but it only flips at the week boundary — hourly polling
  # was 24x the requests for at most one change a week. Offset from the
  # players run so the two never queue behind each other on the shared
  # fetch-commit concurrency group.
  schedule:
    - cron: "45 7 * * *"
  workflow_dispatch:

jobs:
  fetch:
    uses: ./.github/workflows/_fetch.yml
    permissions:
      contents: write
    with:
      name: sleeper/state-nfl
      url: https://api.sleeper.app/v1/state/nfl
      csv: true
